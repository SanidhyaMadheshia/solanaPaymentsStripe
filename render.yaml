# Render Blueprint for the SolPay API (Dashboard → New → Blueprint → pick this repo).
# Database: Neon Postgres (set DATABASE_URL / DIRECT_URL by hand, see README).
# Frontend: deployed separately on Vercel.
services:
  - type: web
    name: solpay-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Neon pooled connection string (host contains "-pooler"), with ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Neon direct (non-pooled) connection string, used only for migrations
      - key: DIRECT_URL
        sync: false
      # Your Vercel URL, e.g. https://solpay.vercel.app (used for checkout_url and CORS)
      - key: PUBLIC_APP_URL
        sync: false
      # Extra allowed origins, comma separated (e.g. a custom domain)
      - key: CORS_ORIGINS
        sync: false
      - key: SOLANA_CLUSTER
        value: devnet
      # Private QuickNode Devnet endpoint (never exposed to browsers)
      - key: SOLANA_RPC_URL
        sync: false
      - key: SOLANA_COMMITMENT
        value: confirmed
      # Stores sign up at /register. Set to "false" to close registration.
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: SESSION_TTL_DAYS
        value: "30"
